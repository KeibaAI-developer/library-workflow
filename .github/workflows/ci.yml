name: CI

on:
  workflow_call:
    inputs:
      package_name:
        description: 'パッケージのディレクトリ名'
        required: true
        type: string
      repo_name:
        description: 'リポジトリ名（キャッシュキー用）'
        required: true
        type: string
      run_unit_test:
        description: '単体テストを実行するかどうか'
        required: false
        type: boolean
        default: true
      run_integration_test:
        description: '結合テストを実行するかどうか'
        required: false
        type: boolean
        default: false
      dependency_library:
        description: '依存ライブラリのリスト（スペース区切り。例: "keiba-scraping mykeibadb-python@v1.0.0"）。lib@refの形式でrefを指定可能。省略時はmainを使用。'
        required: false
        type: string
        default: ''
    secrets:
      GH_PAT:
        description: 'プライベートリポジトリへのアクセストークン'
        required: false

env:
  # ruffのバージョンをここで集中管理する。各ライブラリのpyproject.tomlには
  # 書かない。リポジトリごとに版がずれると同じコードでも判定結果が変わるため。
  RUFF_VERSION: '0.16.3'

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # setup-uvはv8以降メジャータグ（v10等）を提供していないため完全な
      # コミットSHAで固定する。併せてタグ付け替えによるサプライチェーン
      # リスクも避けられる。
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.19'
          python-version: '3.12'
          enable-cache: true
          cache-suffix: ${{ inputs.repo_name }}

      # [tool.ruff]が無いとruffはデフォルトルールセット（E4,E7,E9,F）で走る。
      # 落ちるのではなく黙って検査が緩くなるため気付けない。設定不在は明示的に
      # 落とす。
      - name: Verify ruff config
        run: |
          if ! grep -q '^\[tool\.ruff\]' pyproject.toml; then
            echo "::error file=pyproject.toml::[tool.ruff]が無い。ruffの設定を追加すること"
            exit 1
          fi

      # ruffはASTだけで動きパッケージ本体を必要としないため、依存の解決を
      # 待たずに先に流す。違反があればインストールを待たずに落ちる。
      # ルールは各ライブラリのpyproject.tomlの[tool.ruff]から読む。
      - name: Run ruff
        run: |
          echo "::group::ruff check"
          uvx "ruff@$RUFF_VERSION" check \
            "${{ inputs.package_name }}/" \
            test/ \
            --output-format=github
          echo "::endgroup::"

      # uv pip installの対象を明示するためvenvを作り、そのbinをPATHに載せる。
      # 以降のmypy・pytestはPATH経由で直接呼べる。
      - name: Create virtual environment
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependency libraries
        if: ${{ inputs.dependency_library != '' }}
        env:
          DEPENDENCY_LIBRARY: ${{ inputs.dependency_library }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            printf 'machine github.com\nlogin x-access-token\npassword %s\n' "$GH_PAT" > "$HOME/.netrc"
            chmod 600 "$HOME/.netrc"
          fi
          for lib_ref in $DEPENDENCY_LIBRARY; do
            lib="${lib_ref%%@*}"
            ref="${lib_ref#*@}"
            if [ "$lib" = "$ref" ]; then ref="main"; fi
            uv pip install "git+https://github.com/KeibaAI-developer/$lib.git@$ref"
          done

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run mypy
        run: |
          echo "::group::mypy check"
          mypy "${{ inputs.package_name }}/"
          echo "::endgroup::"

  test:
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.19'
          python-version: '3.12'
          enable-cache: true
          cache-suffix: ${{ inputs.repo_name }}-test

      # uv pip installの対象を明示するためvenvを作り、そのbinをPATHに載せる。
      # 以降のmypy・pytestはPATH経由で直接呼べる。
      - name: Create virtual environment
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependency libraries
        if: ${{ inputs.dependency_library != '' }}
        env:
          DEPENDENCY_LIBRARY: ${{ inputs.dependency_library }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            printf 'machine github.com\nlogin x-access-token\npassword %s\n' "$GH_PAT" > "$HOME/.netrc"
            chmod 600 "$HOME/.netrc"
          fi
          for lib_ref in $DEPENDENCY_LIBRARY; do
            lib="${lib_ref%%@*}"
            ref="${lib_ref#*@}"
            if [ "$lib" = "$ref" ]; then ref="main"; fi
            uv pip install "git+https://github.com/KeibaAI-developer/$lib.git@$ref"
          done

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run unit test
        if: ${{ inputs.run_unit_test }}
        run: |
          pytest test/unit -v --cov=${{ inputs.package_name }} --cov-report=xml --cov-report=term-missing

      - name: Run integration test
        if: ${{ inputs.run_integration_test }}
        run: |
          pytest test/integration -v --cov=${{ inputs.package_name }} --cov-append --cov-report=xml --cov-report=term-missing
